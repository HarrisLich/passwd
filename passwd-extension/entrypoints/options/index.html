<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Passwd Settings</title>
		<style>
			body {
				font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				max-width: 420px;
				margin: 32px auto;
				color: #1a1a1a;
			}
			label {
				display: block;
				margin-bottom: 16px;
			}
			label span {
				display: block;
				font-size: 12px;
				color: #6b6b6b;
				margin-bottom: 4px;
			}
			input[type='text'] {
				width: 100%;
				padding: 8px 10px;
				border: 1px solid #e2e2e2;
				border-radius: 6px;
				font: inherit;
			}
			.checkbox {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			button {
				font: inherit;
				padding: 8px 14px;
				border-radius: 6px;
				border: 1px solid #1a1a1a;
				background: #1a1a1a;
				color: #fff;
				cursor: pointer;
			}
			.status {
				margin-top: 10px;
				font-size: 12px;
				color: #6b6b6b;
			}
		</style>
	</head>
	<body>
		<h1>Passwd settings</h1>
		<main id="app"></main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
